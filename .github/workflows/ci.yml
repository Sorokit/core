name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund

      - name: Run type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Check bundle size budgets and tree shaking
        run: npm run size:check

      - name: Validate build exports
        run: node scripts/validate-exports.js

      - name: Verify ESM tree-shaking and unused code
        run: npm run analyze:unused

  # This job enforces that the merge commit would pass CI
  validate-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund

      - name: Verify no conflicts
        run: |
          if git status | grep -q "both modified"; then
            echo "Merge conflicts detected"
            exit 1
          fi

      - name: Run all checks
        run: npm run typecheck && npm run lint && npm run test:coverage && npm run build && npm run size:check && node scripts/validate-exports.js && npm run analyze:unused
